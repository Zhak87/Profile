name: Deploy job bot

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/job-bot.yml"]
  workflow_dispatch:

concurrency: job-bot-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HH_TOKEN: ${{ secrets.HH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Create D1 database if needed
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="duman-job-bot") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create duman-job-bot
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="duman-job-bot") | .uuid')
          fi
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
          npx wrangler d1 execute duman-job-bot --remote --file schema.sql

      - name: Deploy worker
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL. Open Cloudflare dashboard → Workers & Pages once to pick a workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Upload secrets
        run: |
          jq -n --arg t "$TELEGRAM_BOT_TOKEN" --arg a "$ANTHROPIC_API_KEY" --arg h "$HH_TOKEN" \
            '{TELEGRAM_BOT_TOKEN: $t} + (if $a != "" then {ANTHROPIC_API_KEY: $a} else {} end) + (if $h != "" then {HH_TOKEN: $h} else {} end)' > secrets.json
          npx wrangler secret bulk secrets.json
          rm secrets.json

      - name: Connect Telegram webhook
        run: |
          key=$(printf 'webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$WORKER_URL/setup?key=$key"; then echo; echo "Bot is live at $WORKER_URL"; exit 0; fi
            sleep 10
          done
          echo "::error::Worker deployed but webhook setup failed"
          exit 1
