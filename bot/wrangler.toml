name = "duman-job-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Job search runs every 10 minutes (3 sources per run, rotating).
[triggers]
crons = ["*/10 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "duman-job-bot"
# Filled in by the deploy workflow (.github/workflows/job-bot.yml).
database_id = "__D1_DATABASE_ID__"

[observability]
enabled = true
